<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/5e966f73-eb0d-4013-a0ba-34ac5696c85a" method="POST">
         <label for="nome">Nome:</label>
        <input 
            type="text"
            id="nome" 
            name="nome" 
            required 
            min-lenght="2"
            max-length="50"
            placeholder="Digite seu nome"
        >
        <br><br>
        <label for="email">E-mail:</label>
        <input 
            type="email"
            id="email" 
            name="email" 
            required 
            placeholder="exemplo@dominio.com"
        >
        <br><br>
         <label for="telefone">Telefone:</label>
        <input
            type="tel"
            id="telefone" 
            name="telefone" 
            required 
            placeholder="(XX) XXXX-XXXX"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
        >
        <br><br>
         <label for="idade">Idade:</label>
        <input 
            type="number"
            id="idade" 
            name="idade" 
            required 
            min="18"
            max="120"
            step="1"
        >
        <br><br>
         <label for="data-nascimento">Data de Nascimento:</label>
        <input 
            type="date"
            id="data-nascimento" 
            name="data-nascimento" 
            required 
            min="1900-01-01"
            max="2026-07-24"
        >
        <br><br>
         <label for="website">Página Pessoal:</label>
        <input 
            type="url"
            id="website" 
            name="website" 
            placeholder="https://www.seusite.com"
        >
        <br><br>
         <label for="comentarios">Comentarios:</label>
        <textarea
            id="comentarios" 
            name="comentarios" 
            rows="4"
            cols="50"
            maxlenth="500"
            max-length="50"
            placeholder="Digite seu comentarios aqui"
        ></textarea>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>
</body>
</html>
